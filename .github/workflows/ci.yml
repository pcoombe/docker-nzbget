name: CI

on:
  pull_request:
    branches: ['master']
  push:
    branches: ['master']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: nzbget:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Run smoke test
        run: |
          docker run --rm nzbget:test nzbget --version

      - name: Test health check endpoint
        run: |
          # Start container in background
          docker run -d --name nzbget-test -p 6789:6789 nzbget:test
          # Wait for NZBGet to start
          sleep 10
          # Test web UI
          curl -f http://localhost:6789/ || exit 1
          # Cleanup
          docker stop nzbget-test
          docker rm nzbget-test